<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <h1>Image Gallery</h1>
    <p>A collection of favourite photos</p>
  </header>

  <main>
    <nav class="filters" aria-label="Filter images by category">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="city">City</button>
      <button class="filter-btn" data-filter="animals">Animals</button>
    </nav>

    <section class="gallery" id="gallery">
      <button class="gallery__item" data-category="nature">
        <img src="images/nature-1.jpg" alt="Describe nature photo 1" width="1200" height="800" loading="lazy" />
      </button>
      <button class="gallery__item" data-category="nature">
        <img src="images/nature-2.jpg" alt="Describe nature photo 2" width="1200" height="800" loading="lazy" />
      </button>
      <button class="gallery__item" data-category="nature">
        <img src="images/nature-3.jpg" alt="Describe nature photo 3" width="1200" height="800" loading="lazy" />
      </button>

      <button class="gallery__item" data-category="city">
        <img src="images/city-1.jpg" alt="Describe city photo 1" width="1200" height="800" loading="lazy" />
      </button>
      <button class="gallery__item" data-category="city">
        <img src="images/city-2.jpg" alt="Describe city photo 2" width="1200" height="800" loading="lazy" />
      </button>
      <button class="gallery__item" data-category="city">
        <img src="images/city-3.jpg" alt="Describe city photo 3" width="1200" height="800" loading="lazy" />
      </button>

      <button class="gallery__item" data-category="animals">
        <img src="images/animals-1.jpg" alt="Describe animal photo 1" width="1200" height="800" loading="lazy" />
      </button>
      <button class="gallery__item" data-category="animals">
        <img src="images/animals-2.jpg" alt="Describe animal photo 2" width="1200" height="800" loading="lazy" />
      </button>
      <button class="gallery__item" data-category="animals">
        <img src="images/animals-3.jpg" alt="Describe animal photo 3" width="1200" height="800" loading="lazy" />
      </button>
    </section>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
